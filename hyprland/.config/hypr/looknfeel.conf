$activeBorderColor = rgba(ffffffcc)

general {
  gaps_in = 5
  gaps_out = 10

  border_size = 2

  col.active_border = $activeBorderColor 
  resize_on_border = false

  allow_tearing = false

  layout = dwindle
}

group {
  col.border_active = $activeBorderColor
  col.border_locked_active = -1
  col.border_locked_inactive = -1

  groupbar {
    font_size = 12
    font_family = CaskaydiaMono Nerd Font
    font_weight_active = ultraheavy
    font_weight_inactive = normal

    indicator_height = 0
    indicator_gap = 5
    height = 22
    gaps_in = 5
    gaps_out = 0

    text_color = rgb(ffffff)
    text_color_inactive = rgba(ffffff90)
    col.active = rgba(00000040)
    col.inactive = rgba(00000020)

    gradients = true
    gradient_rounding = 0
    gradient_round_only_edges = false
  }
}

decoration {
  rounding = 0


  shadow {
  enabled = false
  }

  blur {
  enabled = true
  size = 3
  passes = 1
  }
}

animations {
  enabled = true 

  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
  bezier = linear, 0, 0, 1, 1
  bezier = almostLinear, 0.5, 0.5, 0.75, 1
  bezier = quick, 0.15, 0, 0.1, 1


  # animation = NAME, ON/OFF, SPEED (x * 100ms), CURVE, (STYLE)
  animation = global, 1, 10, default
  animation = windows, 1, 4,  easeOutQuint
  animation = windowsIn, 1, 2, easeOutQuint, popin 87%
  animation = windowsOut, 1, 1.5, linear, popin 87%
  animation = fade, 1, 3.03,  quick
  animation = layers, 1, 3.81,  easeOutQuint
  animation = workspaces, 1, 1.75, easeInOutCubic, slide
}


dwindle {
  pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # You probably want this
}


# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
  disable_hyprland_logo = true
}

