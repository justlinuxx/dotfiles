$font = CaskaydiaMono Nerd Font Mono

general {
  hide_cursor = false
  ignore_empty_input = true
}

animations {
  enabled = true
  bezier = linear, 1, 1, 0, 0
  animation = fadeIn, 1, 1, linear
  animation = fadeOut, 1, 1, linear
  animation = inputFieldDots, 1, 1, linear
}

background {
  monitor =
  path = ~/Pictures/Backgrounds/house_lake.jpg
  blur_passes = 0
}

input-field {
  monitor =
  size = 20%, 5%
  outline_thickness = 3
  inner_color = rgba(00000044) # no fill

  outer_color = rgba(ffffffee) 
  check_color = rgba(ff6633ee)
  fail_color = rgba(ff6633ee) 

  font_color = rgb(ffffff)
  fade_on_empty = false
  rounding = 5

  font_family = $font
  placeholder_text = Logging in as <b>$USER</b>
  fail_text = Authentication failed ($ATTEMPTS attempts)

  dots_spacing = 0.3

  position = 0, -20
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
  font_size = 90
  font_family = $font

  position = 0, 150
  halign = center
  valign = center
}

